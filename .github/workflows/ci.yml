name: CI

# The full test suite, including the end-to-end demo against the real terraform
# CLI. Zero model calls (the demo replays recorded answers) and zero secrets --
# this must stay runnable on every PR from a fork.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # The wrapper rewrites stdout, which breaks `terraform show -json`.
          terraform_wrapper: false

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q
